<body style="background:#fff;margin:0">
  <div id="root" style="opacity:0;transition:opacity .2s ease"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Reveal the app once React has rendered AND fonts are loaded
    // (prevents flash of icon text like "shopping_bag", "menu", etc.)
    (function () {
      var revealed = false;
      function reveal() {
        if (revealed) return;
        revealed = true;
        var r = document.getElementById('root');
        if (r) r.style.opacity = '1';
      }
      var rendered = false;
      new MutationObserver(function (m, o) {
        var r = document.getElementById('root');
        if (r && r.children.length) {
          rendered = true;
          o.disconnect();
          // Wait for fonts (especially Material Symbols) before showing
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(reveal);
          } else {
            reveal();
          }
        }
      }).observe(document.getElementById('root'), { childList: true });
      // Also listen for fonts ready in case they load after render
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { if (rendered) reveal() });
      }
      // Fallback: reveal after 3s no matter what
      setTimeout(reveal, 3000);
    })();
  </script>
</body>
