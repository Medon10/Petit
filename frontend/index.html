<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/PetitIcon.jpg" />
  <link rel="apple-touch-icon" href="/PetitIcon.jpg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#C76DA2" />
  <title>Petit Accesorios</title>

  <!-- Default Open Graph -->
  <meta property="og:site_name" content="Petit Accesorios" />
  <meta property="og:locale" content="es_AR" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://petitaccesorios.com.ar/PetitIcon.jpg" />

  <!-- Default Twitter Card -->
  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Alkalami&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
</head>

<body style="background:#fff;margin:0">
  <div id="root" style="opacity:0;transition:opacity .15s ease"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Reveal the app once React has rendered (prevents flash of unstyled content)
    new MutationObserver(function(m,o){
      var r=document.getElementById('root');
      if(r&&r.children.length){r.style.opacity='1';o.disconnect()}
    }).observe(document.getElementById('root'),{childList:true});
    // Fallback: reveal after 1.5s even if mutation observer fails
    setTimeout(function(){var r=document.getElementById('root');if(r)r.style.opacity='1'},1500);
  </script>
</body>

</html>
